<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phones for Sale</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
 
  :root{
    --bg: #ECEDEF;
    --bg-deep: #DFE1E4;
    --card: #FFFFFF;
    --ink: #1B1C1F;
    --ink-soft: #6B6D74;
    --line: #D2D4D8;
    --accent: #E1362C;
    --accent-ink: #FFFFFF;
    --available: #2E9E5B;
    --sold: #A9ABB2;
    --pending: #D6A32B;
    --focus: #3D5AFE;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }
  :focus-visible{ outline: 3px solid var(--focus); outline-offset: 2px; }
  header{ max-width: 1080px; margin: 0 auto; padding: 56px 24px 32px; }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-soft); display: flex; align-items: center;
    gap: 10px; margin-bottom: 14px;
  }
  .eyebrow::before{ content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--available); box-shadow: 0 0 0 3px rgba(46,158,91,0.18); }
  h1{ font-family: 'Space Grotesk', sans-serif; font-size: clamp(34px, 5.5vw, 52px); line-height: 1.05; letter-spacing: -0.01em; margin: 0 0 14px; }
  header p.sub{ max-width: 560px; color: var(--ink-soft); font-size: 16px; line-height: 1.55; margin: 0; }
  header p.sub strong{ color: var(--ink); font-weight: 600; }
  .grid{ max-width: 1080px; margin: 0 auto; padding: 8px 24px 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .tag{ background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 0; cursor: pointer; text-align: left; font-family: inherit; position: relative; overflow: hidden; transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; display: flex; flex-direction: column; }
  .tag:hover, .tag:focus-visible{ transform: translateY(-3px); box-shadow: 0 14px 28px -14px rgba(20,20,25,0.28); border-color: #BFC2C8; }
  .tag:active{ transform: translateY(-1px); }
  .tag-top{ display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
  .tag-num{ font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--ink-soft); }
  .tag-num b{ color: var(--ink); font-size: 15px; }
  .status-pill{ font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .status-pill.available{ background: rgba(46,158,91,0.12); color: var(--available); }
  .status-pill.sold{ background: rgba(169,171,178,0.18); color: #85878E; }
  .status-pill.pending{ background: rgba(214,163,43,0.16); color: #9C7A1F; }
  .tag-visual{ height: 128px; margin: 10px 16px 0; border-radius: 10px; background: linear-gradient(160deg, #22242A 0%, #3A3D45 100%); display: flex; align-items: center; justify-content: center; position: relative; }
  .tag-visual .phone-icon{ width: 46px; height: 92px; border-radius: 9px; border: 2px solid rgba(255,255,255,0.85); position: relative; background: rgba(255,255,255,0.03); }
  .tag-visual .phone-icon::before{ content:""; position:absolute; top:8px; left:50%; transform: translateX(-50%); width: 16px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.7); }
  .tag-visual img{ width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  .tag-body{ padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .tag-name{ font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; }
  .tag-spec{ font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-soft); }
  .tag-price{ margin-top: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; }
  .tag[data-status="sold"]{ opacity: 0.55; }
  .tag[data-status="sold"] .tag-visual{ filter: grayscale(1); }
  .tag[data-status="pending"]{ opacity: 0.8; }
  .tag::after{ content:""; position:absolute; top: 14px; right: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
  .backdrop{ position: fixed; inset: 0; background: rgba(15,16,18,0.55); backdrop-filter: blur(2px); display: none; align-items: flex-end; justify-content: center; z-index: 50; padding: 0; }
  .backdrop.open{ display: flex; }
  @media (min-width: 640px){ .backdrop{ align-items: center; padding: 24px; } }
  .sheet{ background: var(--card); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 28px 26px 30px; position: relative; animation: rise 0.24s ease; }
  @media (min-width: 640px){ .sheet{ border-radius: 20px; } }
  @keyframes rise{ from{ transform: translateY(16px); opacity: 0; } to{ transform: translateY(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce){ .sheet{ animation: none; } .tag{ transition: none; } }
  .sheet-close{ position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); }
  .sheet-close:hover{ background: var(--bg-deep); color: var(--ink); }
  .sheet-tag{ font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
  .sheet-visual{ height: auto; aspect-ratio: 9 / 16; border-radius: 12px; background: linear-gradient(160deg, #22242A 0%, #3A3D45 100%); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; overflow: hidden; }
  .sheet-visual img{ width: 100%; height: 100%; object-fit: contain; }
  .sheet-visual .phone-icon{ width: 56px; height: 112px; border-radius: 11px; border: 2px solid rgba(255,255,255,0.85); position: relative; }
  .sheet-visual .phone-icon::before{ content:""; position:absolute; top:10px; left:50%; transform: translateX(-50%); width: 18px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.7); }
  .sheet h2{ font-family: 'Space Grotesk', sans-serif; font-size: 26px; margin: 0 0 4px; }
  .sheet .price{ font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 18px; }
  .spec-table{ display: grid; grid-template-columns: auto 1fr; row-gap: 10px; column-gap: 16px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .spec-table dt{ font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); align-self: center; }
  .spec-table dd{ margin: 0; font-size: 14.5px; font-weight: 500; align-self: center; }
  .sheet-note{ font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin-bottom: 22px; }
  .cta{ display: block; width: 100%; text-align: center; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15.5px; padding: 15px 20px; border-radius: 11px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
  .cta:hover{ background: #C92A21; }
  .cta[disabled]{ background: var(--sold); cursor: not-allowed; pointer-events: none; }
  .cta-hint{ text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; font-family: 'JetBrains Mono', monospace; }
  footer{ text-align: center; padding: 0 24px 60px; color: var(--ink-soft); font-size: 13px; font-family: 'JetBrains Mono', monospace; }
</style>
</head>

const grid = document.getElementById('grid');

function messageLink(phone){
  return `https://m.me/${SELLER_FB_USERNAME}`;
}

phones.forEach((phone, i) => {
  const card = document.createElement('button');
  card.className = 'tag';
  card.type = 'button';
  card.dataset.status = phone.status;
  card.innerHTML = `
    <div class="tag-top">
      <span class="tag-num">PHONE <b>${phone.label}</b></span>
      <span class="status-pill ${phone.status}">${phone.status === 'sold' ? 'Sold' : phone.status === 'pending' ? 'Pending' : 'Available'}</span>
    </div>
    <div class="tag-visual">${phone.image ? `<img src="${phone.image}" alt="${phone.name}">` : `<div class="phone-icon"></div>`}</div>
    <div class="tag-body">
      <div class="tag-name">${phone.name}</div>
      <div class="tag-spec">${phone.storage} · ${phone.color}</div>
      <div class="tag-price">${phone.price}</div>
    </div>
  `;
  card.addEventListener('click', () => openSheet(phone));
  grid.appendChild(card);
});

const backdrop = document.getElementById('backdrop');
const sheetTag = document.getElementById('sheetTag');
const sheetTitle = document.getElementById('sheetTitle');
const sheetPrice = document.getElementById('sheetPrice');
const sheetSpecs = document.getElementById('sheetSpecs');
const sheetNote = document.getElementById('sheetNote');
const sheetCta = document.getElementById('sheetCta');
const sheetHint = document.getElementById('sheetHint');

function openSheet(phone){
  sheetTag.textContent = `PHONE ${phone.label}`;
  document.querySelector('.sheet-visual').innerHTML = phone.image
    ? `<img src="${phone.image}" alt="${phone.name}">`
    : `<div class="phone-icon"></div>`;
  sheetTitle.textContent = phone.name;
  sheetPrice.textContent = phone.price;
  sheetNote.textContent = phone.note || "";

  sheetSpecs.innerHTML = `
    <dt>Storage</dt><dd>${phone.storage}</dd>
    <dt>Condition</dt><dd>${phone.condition}</dd>
    <dt>Battery</dt><dd>${phone.battery}</dd>
    <dt>Color</dt><dd>${phone.color}</dd>
  `;

  if(phone.status === 'sold'){
    sheetCta.textContent = 'Already sold';
    sheetCta.setAttribute('disabled', 'true');
    sheetCta.removeAttribute('href');
    sheetHint.textContent = '';
  } else if(phone.status === 'pending'){
    sheetCta.textContent = `Ask about ${phone.label}`;
    sheetCta.removeAttribute('disabled');
    sheetCta.href = messageLink(phone);
    sheetHint.textContent = `This one has a pending buyer — message me and I'll let you know if it falls through.`;
  } else {
    sheetCta.textContent = `Message about ${phone.label}`;
    sheetCta.removeAttribute('disabled');
    sheetCta.href = messageLink(phone);
    sheetHint.textContent = `Just mention "${phone.label}" and I'll know exactly which one you mean.`;
  }

  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSheet(){
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('sheetClose').addEventListener('click', closeSheet);
backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeSheet(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeSheet(); });

</script>
</body>
</html>
